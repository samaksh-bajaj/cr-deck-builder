<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clash Royale Deck Builder</title>
<style>
  :root {
    --bg: #10131c;
    --panel: #1a1f2e;
    --line: #2c3346;
    --text: #eef1f7;
    --muted: #99a2b8;
    --gold: #f2c14e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px 64px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 0.95rem; }

  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input {
    flex: 1 1 200px; min-width: 0;
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-size: 1rem;
  }
  input:focus { outline: 2px solid var(--gold); outline-offset: -1px; }
  button {
    padding: 12px 22px;
    background: var(--gold);
    border: 0; border-radius: 8px;
    color: #221a05;
    font-size: 1rem; font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: progress; }

  #out { margin-top: 32px; }
  .msg { color: var(--muted); }
  .err { color: #ff8f8f; }

  .headline { display: flex; justify-content: space-between; align-items: baseline;
              gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .score { font-size: 1.5rem; font-weight: 700; color: var(--gold); }
  .from { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }

  .deck {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .card { text-align: center; }
  /* Card art is 285x420. Reserving the space stops the grid jumping around
     while the images load. */
  .card img { width: 100%; display: block; aspect-ratio: 285 / 420; }
  .card span { display: block; font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .card.maxed span { color: var(--gold); }

  .copy {
    display: inline-block; margin-top: 22px;
    padding: 11px 20px;
    border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); text-decoration: none;
  }
  .copy:hover { border-color: var(--gold); }
  .foot { margin-top: 26px; font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Clash Royale Deck Builder</h1>
  <p class="sub">The top players' deck that your card levels suit best.</p>

  <form id="form">
    <input id="tag" placeholder="#2P0LYQ" aria-label="Player tag" autocomplete="off" required>
    <button id="go" type="submit">Find my deck</button>
  </form>

  <div id="out"></div>
</main>

<script>
  const form = document.getElementById("form");
  const input = document.getElementById("tag");
  const button = document.getElementById("go");
  const out = document.getElementById("out");

  const escape = (text) => String(text).replace(/[&<>"']/g,
    (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const tag = input.value.trim();
    if (!tag) return;

    button.disabled = true;
    out.innerHTML = '<p class="msg">Looking through the top decks…</p>';

    try {
      const response = await fetch("/api/best_deck?tag=" + encodeURIComponent(tag));

      // Read as text first. A crashed function returns an HTML error page, and
      // parsing that as JSON would throw and get misreported as "no server".
      const body = await response.text();
      let data = null;
      try { data = JSON.parse(body); } catch (parseError) { /* not JSON */ }

      if (!response.ok || data === null) {
        out.innerHTML = '<p class="err">' + escape(explain(response, data, body)) + "</p>";
        return;
      }
      render(data);
    } catch (error) {
      // Only a genuine network failure reaches here.
      out.innerHTML = '<p class="err">Couldn\'t reach the server: '
        + escape(error.message) + "</p>";
    } finally {
      button.disabled = false;
    }
  });

  function explain(response, data, body) {
    if (response.status === 404 && data) return "No player with that tag.";
    if (data && data.error) return data.error;
    // Not JSON, so the platform failed before our code answered. Show enough of
    // it to act on rather than hiding it behind a generic message.
    const text = body.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
    return "Server error " + response.status + ". " + text.slice(0, 200);
  }

  function render(data) {
    if (!data.found) {
      out.innerHTML = '<p class="msg">No decks found.</p>';
      return;
    }

    const cards = data.cards.map((card) => `
      <div class="card${card.level === 16 ? " maxed" : ""}">
        <img src="${escape(card.icon)}" loading="lazy"
             alt="${escape(card.form ? card.form + " " + card.name : card.name)}">
        <span>${card.level}</span>
      </div>`).join("");

    out.innerHTML = `
      <div class="headline">
        <strong>${escape(data.player.name)}</strong>
        <span class="score">${data.score}<span style="opacity:.5">/${data.max_score}</span></span>
      </div>
      <p class="from">from rank ${data.source.rank} — ${escape(data.source.name)}</p>
      <div class="deck">${cards}</div>
      <a class="copy" href="${escape(data.copy_link)}">Copy deck in game</a>
      <p class="foot">Top ${data.players} of Path of Legends season ${escape(data.season)},
         snapshot taken ${escape(data.generated_at.slice(0, 10))}.</p>`;
  }
</script>
</body>
</html>
